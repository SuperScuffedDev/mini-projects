<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div>

    </div>
    <div id="gameboard">
        <div data-x="0" data-y="0" class="cell">
            <svg class="marker o" viewbox="0 0 100 100">
                <circle
                    cx="50"
                    cy="50"
                    r="35"
                    fill="black"
                    stroke="#00ff22"
                    stroke-width="5"
                />
            </svg>
        </div>
        <div data-x="1" data-y="0" class="cell">
        </div>
        <div data-x="2" data-y="0" class="cell"></div>
        <div data-x="0" data-y="1" class="cell">
            <svg class="marker x" viewbox="0 0 100 100">
                <polygon
                    points="
                        25, 15
                        15, 25
                        40, 50
                        15, 75
                        25, 85
                        50, 60
                        75, 85
                        85, 75
                        60, 50
                        85, 25
                        75, 15
                        50, 40
                    "
                    stroke="red"
                    stroke-width="5"
                />
            </svg>
        </div>
        <div data-x="1" data-y="1" class="cell"></div>
        <div data-x="2" data-y="1" class="cell"></div>
        <div data-x="0" data-y="2" class="cell"></div>
        <div data-x="1" data-y="2" class="cell"></div>
        <div data-x="2" data-y="2" class="cell"></div>
    </div>
    <div>

    </div>
    <script src="./script.js"></script>
</body>
</html>
