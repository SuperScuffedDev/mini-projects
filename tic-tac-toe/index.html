<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div>
        <h1>Tic Tac Toe</h1>
        <p id="log">X's Turn</p>
    </div>
    <div id="gameboard">
        <div data-x="0" data-y="0" class="cell"></div>
        <div data-x="1" data-y="0" class="cell"></div>
        <div data-x="2" data-y="0" class="cell"></div>
        <div data-x="0" data-y="1" class="cell"></div>
        <div data-x="1" data-y="1" class="cell"></div>
        <div data-x="2" data-y="1" class="cell"></div>
        <div data-x="0" data-y="2" class="cell"></div>
        <div data-x="1" data-y="2" class="cell"></div>
        <div data-x="2" data-y="2" class="cell"></div>
    </div>
    <div id="button-container">
        <p id="score">Score: </p>
        <button id="new-game">New Game</button>
    </div>
    <script src="./script.js"></script>
</body>
</html>
