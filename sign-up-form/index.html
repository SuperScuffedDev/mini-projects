<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div>
        <div id="logo-banner">
            <svg class="logo" width="150" height="150"viewbox="0 0 100 100">
                <circle
                    cx="50"
                    cy="50"
                    r="45"
                    fill="white"
                    stroke="black"
                    stroke-width="1"
                />
                <circle
                    cx="30"
                    cy="40"
                    r="10"
                    fill="black"
                    stroke="black"
                    stroke-width="1"
                />
                <circle
                    cx="70"
                    cy="40"
                    r="10"
                    fill="black"
                    stroke="black"
                    stroke-width="1"
                />
                <ellipse
                    cx="50"
                    cy="70"
                    rx="20"
                    ry="15"
                    fill="black"
                    stroke="black"
                    stroke-width="2"
                />
                <rect
                    x="28"
                    y="70"
                    width="44"
                    height="19"
                    fill="white"
                    stroke="black"
                    stroke-width="0"
                />
                <circle
                    cx="50"
                    cy="50"
                    r="45"
                    fill="none"
                    stroke="black"
                    stroke-width="2"
                />
            </svg>
            <h1 class="logo">WTF</h1>
        </div>
    </div>
    <div id="right">
        <div>
            <p><strong>This is the end. join now.</strong></p>
        </div>
        <div id="form-div">
            <h2>Sign up or else</h2>
            <form id="information" action="" method="post">
                <div class="form-row">
                    <div class="form-col">
                        <label for="first-name">First Name</label>
                        <input id="first-name" type="text" placeholder="John" required>
                    </div>
                    <div class="form-col">
                        <label for="last-name">Last Name</label>
                        <input id="last-name" type="text" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <label for="email">email</label>
                        <input id="email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-col">
                        <label for="tel">Phone Number</label>
                        <input id="tel" type="tel" maxlength="10" placeholder="0000000000" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <label for="password">Password</label>
                        <input id="password" type="password" maxlength="20" required>
                    </div>
                    <div class="form-col">
                        <label for="password-confirm">Confirm Password</label>
                        <input id="password-confirm" type="password" maxlength="20" required>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <button form="information" type="submit">Create Account</button>
            <p>Already have an account? <strong><a href="./login.html">Log In</a></strong></p>
        </div>
    </div>
</body>
</html>
