<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>
            Library
        </h1>
    </header>
    <main>
        <div>
            <form id="new-book">
                <div class="form-row">
                    <label for="title">Title</label>
                    <input id="title" type="text" name="title" placeholder="The Hobbit" required>
                </div>

                <div class="form-row">
                    <label for="author">Author</label>
                    <input id="author" type="text" name="author" placeholder="J.R.R." required>
                </div>

                <div class="form-row">
                    <label for="pages">Page Count</label>
                    <input id="pages" type="number" name="pages"  placeholder="310" required>
                </div>

                <div class="form-row">
                    <label for="read">Have you read this?</label>
                    <input id="read" type="checkbox" name="read">
                    <button id="add-book" type="submit">Add Book</button>
                </div>
            </form>
        </div>
        <div id="library-display">

        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
